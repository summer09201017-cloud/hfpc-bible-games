<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>聖經闖關大富翁遊戲</title>
    <meta
      name="description"
      content="HFPC 聖經遊戲總入口 — 選一段旅程開始(約拿、保羅…)"
    />
    <meta name="theme-color" content="#f4ead6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <!-- 動態總開關（0903）：沒有 IntersectionObserver、或使用者選了「減少動態」，就不加這個 class；
         styles.css 裡所有 opacity:0 的起始狀態都掛在它底下 ⇒ 沒加就是「全部直接看得見」。 -->
    <script>try{if(window.IntersectionObserver&&!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches))document.documentElement.classList.add('js-motion')}catch(e){}</script>
  </head>
  <body>
    <header class="hero">
      <h1 class="hero__title">聖經闖關大富翁遊戲</h1>
      <p class="hero__subtitle">選一段旅程開始 ✦ 主日學・全家適用</p>
      <nav class="hero__nav">
        <a class="topbtn" href="#/verses">📖 金句複習・朗讀</a>
        <a class="topbtn" href="#/scoreboard">🏆 分組計分板</a>
      </nav>
      <!-- 安裝按鈕由 src/main.js 視平台動態塞入(不能裝就不顯示) -->
      <div id="install-slot" class="install-slot"></div>
      <!-- 換色外皮:色點由 src/main.js 注入(localStorage 記住選擇) -->
      <div id="theme-slot" class="theme-pick" aria-label="背景顏色"></div>
    </header>

    <main id="app" class="app"><!-- 卡片由 src/main.js 依 data.js 產生 --></main>

    <footer class="foot">
      <p id="footCount">HFPC 聖經遊戲 ・ 點任一張卡片進入該旅程</p>
      <p><a href="https://hfpc-play-stats.summer09201017.workers.dev/stats" target="_blank" style="color:inherit;text-decoration:underline">📊 使用統計(同工用)</a></p>
    </footer>

    <script type="module" src="/src/main.js"></script>
    <!-- 動態（進場/餘火/輪播/捲動浮現/拉幕）：一定排在 main.js 之後——它要等 route() 把卡片畫好 -->
    <script type="module" src="/src/motion.js"></script>
    <script>
      // play-stats 三層匿名計數(lobby-play-rank §3/§4):開啟 10 分去重;-start/-done 不去重;-done 帶 t=秒。零個資。
      window.psPing = function (key, t) {
        try {
          // ⚠ 0813:這行原本是白名單 `if (!hostname.endsWith('netlify.app')) return;`——
          //   大廳 07-22 搬到 CF Workers 後,workers.dev 不符合白名單 ⇒ 每一次都提早 return
          //   ⇒ 大廳從搬家那天起「一次都沒打點過」,而且完全沒有錯誤訊息。
          //   統計實錄:07-21 前約 15 次/天(尖峰 33)→ 07-22 起掉到 1~2 次/天,
          //   剩下那一點是還開著舊 netlify 網址(SW 快取)的人 ⇒ /stats 上大廳看起來像沒人來。
          // ★ 改用艦隊主流的**黑名單**寫法(只擋本機開發,其餘一律放行):
          //   白名單綁平台 = 每次搬家都會靜靜斷流,而搬家的人不會想到要回來改這行。
          if (['localhost', '127.0.0.1'].includes(location.hostname)) return;
          var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
          if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
        } catch (_) {}
      };
      try {
        var psK = 'ps-last-lobby';
        var psLast = parseInt(localStorage.getItem(psK) || '0', 10);
        if (Date.now() - psLast > 600000) { localStorage.setItem(psK, String(Date.now())); window.psPing('lobby'); }
      } catch (_) { window.psPing('lobby'); }
      // 真實停留(skill play-stats-dwell):開頁 → 第一次離開,回報一發 -dwell 帶秒數。
      // 開啟次數只看「被點幾次」,停留時間才看得出「孩子真的待多久、哪一關抓得住人」。
      // ★ 只送這一發:手機鎖屏時常只送得出佇列第一個 beacon,同一刻連發兩個會有一發被丟掉。
      (function () {
        var _dwT0 = Date.now(), _dwSent = false;
        function _dwLeave() {
          if (_dwSent) return; _dwSent = true;
          var sec = Math.round((Date.now() - _dwT0) / 1000);
          if (sec < 3 || sec > 1800) return;   // 誤觸不算、掛整天的背景分頁也不算
          window.psPing('lobby-dwell', sec);
        }
        addEventListener('pagehide', _dwLeave);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') _dwLeave();
        });
      })();
    </script>
  
<!-- 📺 90 秒作品介紹・兩支(2026-08-04;取代 07-22 的 60 秒單支)
     分眾:遊戲篇給孩子與家長看,工具篇給同工與長輩看。刻意**不自動播**(省流量)。 -->
<section style="max-width:760px;margin:32px auto;padding:0 16px;text-align:center">
  <h2 style="font-size:22px;margin-bottom:12px">📺 九十秒認識德義作品</h2>
  <div style="display:grid;gap:20px">
    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px;opacity:.85">🎮 遊戲篇 — 3D 運動・聖經闖關・經典重製</div>
      <video controls playsinline preload="metadata" style="width:100%;border-radius:12px;background:#000" src="intro90-games.mp4?v=905"></video>
    </div>
    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px;opacity:.85">🛠 工具篇 — 聖經查詢・AI 應用・生活工具</div>
      <video controls playsinline preload="metadata" style="width:100%;border-radius:12px;background:#000" src="intro90-tools.mp4?v=905"></video>
    </div>
  </div>
</section>
<div id="appVerBadge" style="position:fixed;right:6px;bottom:4px;font-size:11px;line-height:1;opacity:.55;z-index:2147483000;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-family:system-ui,sans-serif"></div>
    <script>
      /* 🏷️ appVerBadgeFade（0828）：版號徽章是 position:fixed 在右下角，實測會蓋住大廳卡片、
         遊戲的「難度 / 開始比賽」按鈕——pointer-events:none 只讓「點擊」穿過去，字還是被蓋著。
         做法：10 秒後淡出。要看版本就重新整理，平常不擋畫面。 */
      ;(function () {
        var b = document.getElementById('appVerBadge')
        if (!b) return
        b.style.transition = 'opacity .8s'
        setTimeout(function () {
          b.style.opacity = '0'
          setTimeout(function () { b.style.display = 'none' }, 900)
        }, 10000)
      })()
    </script>
<script>
/* 🏷️ 版號徽章(0820 全艦隊批次):問「正在控制本頁的 SW」拿版本=你手上真的在跑的那一版,
   頁面不寫死任何版號(不會漂)。硬重整(Ctrl+F5)的分頁不受 SW 管、問不到 → 誠實顯示退路
   (股票管家 v134 同款);SW 換版接管時會再問,自動換新。 */
(function () {
  var el = document.getElementById('appVerBadge');
  if (!el || !('serviceWorker' in navigator) || location.protocol !== 'https:') return;
  var got = false;
  navigator.serviceWorker.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'SW_VERSION') {
      got = true;
      var s = String(e.data.v), m = /-((?:v|nf)?\d+)$/.exec(s);
      el.textContent = '🏷️ 版本 ' + (m ? m[1] : s) + '(這台裝置實際執行中的版本)';
    }
  });
  function ask() { var c = navigator.serviceWorker.controller; if (c) c.postMessage('GET_VERSION'); }
  navigator.serviceWorker.ready.then(ask).catch(function () {});
  navigator.serviceWorker.addEventListener('controllerchange', ask);
  setTimeout(function () {
    if (got) return;
    if (!navigator.serviceWorker.controller) el.textContent = '🏷️ 版本 —(強制重新整理的分頁問不到;普通重整一次即顯示)';
    else { ask(); setTimeout(function () { if (!got) el.textContent = '🏷️ 版本 —(讀不到,重整一次即顯示)'; }, 1500); }
  }, 1600);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>聖經闖關大富翁遊戲</title>
    <meta
      name="description"
      content="HFPC 聖經遊戲總入口 — 選一段旅程開始(約拿、保羅…)"
    />
    <meta name="theme-color" content="#f4ead6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1 class="hero__title">聖經闖關大富翁遊戲</h1>
      <p class="hero__subtitle">選一段旅程開始 ✦ 主日學・全家適用</p>
      <nav class="hero__nav">
        <a class="topbtn" href="#/verses">📖 金句複習・朗讀</a>
        <a class="topbtn" href="#/scoreboard">🏆 分組計分板</a>
      </nav>
      <!-- 安裝按鈕由 src/main.js 視平台動態塞入(不能裝就不顯示) -->
      <div id="install-slot" class="install-slot"></div>
      <!-- 換色外皮:色點由 src/main.js 注入(localStorage 記住選擇) -->
      <div id="theme-slot" class="theme-pick" aria-label="背景顏色"></div>
    </header>

    <main id="app" class="app"><!-- 卡片由 src/main.js 依 data.js 產生 --></main>

    <footer class="foot">
      <p id="footCount">HFPC 聖經遊戲 ・ 點任一張卡片進入該旅程</p>
      <p><a href="https://hfpc-play-stats.summer09201017.workers.dev/stats" target="_blank" style="color:inherit;text-decoration:underline">📊 使用統計(同工用)</a></p>
    </footer>

    <script type="module" src="/src/main.js"></script>
    <script>
      // play-stats 三層匿名計數(lobby-play-rank §3/§4):開啟 10 分去重;-start/-done 不去重;-done 帶 t=秒。零個資。
      window.psPing = function (key, t) {
        try {
          // ⚠ 0813:這行原本是白名單 `if (!hostname.endsWith('netlify.app')) return;`——
          //   大廳 07-22 搬到 CF Workers 後,workers.dev 不符合白名單 ⇒ 每一次都提早 return
          //   ⇒ 大廳從搬家那天起「一次都沒打點過」,而且完全沒有錯誤訊息。
          //   統計實錄:07-21 前約 15 次/天(尖峰 33)→ 07-22 起掉到 1~2 次/天,
          //   剩下那一點是還開著舊 netlify 網址(SW 快取)的人 ⇒ /stats 上大廳看起來像沒人來。
          // ★ 改用艦隊主流的**黑名單**寫法(只擋本機開發,其餘一律放行):
          //   白名單綁平台 = 每次搬家都會靜靜斷流,而搬家的人不會想到要回來改這行。
          if (['localhost', '127.0.0.1'].includes(location.hostname)) return;
          var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
          if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
        } catch (_) {}
      };
      try {
        var psK = 'ps-last-lobby';
        var psLast = parseInt(localStorage.getItem(psK) || '0', 10);
        if (Date.now() - psLast > 600000) { localStorage.setItem(psK, String(Date.now())); window.psPing('lobby'); }
      } catch (_) { window.psPing('lobby'); }
    </script>
  
<!-- 📺 90 秒作品介紹・兩支(2026-08-04;取代 07-22 的 60 秒單支)
     分眾:遊戲篇給孩子與家長看,工具篇給同工與長輩看。刻意**不自動播**(省流量)。 -->
<section style="max-width:760px;margin:32px auto;padding:0 16px;text-align:center">
  <h2 style="font-size:22px;margin-bottom:12px">📺 九十秒認識德義作品</h2>
  <div style="display:grid;gap:20px">
    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px;opacity:.85">🎮 遊戲篇 — 3D 運動・聖經闖關・經典重製</div>
      <video controls playsinline preload="metadata" style="width:100%;border-radius:12px;background:#000" src="intro90-games.mp4?v=905"></video>
    </div>
    <div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px;opacity:.85">🛠 工具篇 — 聖經查詢・AI 應用・生活工具</div>
      <video controls playsinline preload="metadata" style="width:100%;border-radius:12px;background:#000" src="intro90-tools.mp4?v=905"></video>
    </div>
  </div>
</section>
</body>
</html>

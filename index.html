<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>聖經闖關大富翁遊戲</title>
    <meta
      name="description"
      content="HFPC 聖經遊戲總入口 — 選一段旅程開始(約拿、保羅…)"
    />
    <meta name="theme-color" content="#f4ead6" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <h1 class="hero__title">聖經闖關大富翁遊戲</h1>
      <p class="hero__subtitle">選一段旅程開始 ✦ 主日學・全家適用</p>
      <nav class="hero__nav">
        <a class="topbtn" href="#/verses">📖 金句複習・朗讀</a>
        <a class="topbtn" href="#/scoreboard">🏆 分組計分板</a>
      </nav>
      <!-- 安裝按鈕由 src/main.js 視平台動態塞入(不能裝就不顯示) -->
      <div id="install-slot" class="install-slot"></div>
      <!-- 換色外皮:色點由 src/main.js 注入(localStorage 記住選擇) -->
      <div id="theme-slot" class="theme-pick" aria-label="背景顏色"></div>
    </header>

    <main id="app" class="app"><!-- 卡片由 src/main.js 依 data.js 產生 --></main>

    <footer class="foot">
      <p>HFPC 聖經遊戲 ・ 點任一張卡片進入該旅程</p>
      <p>
        <a href="https://hfpc-portfolio.netlify.app" target="_blank" rel="noopener"
          >👨‍💻 德義作品集</a
        >
      </p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
